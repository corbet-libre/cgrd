[package]
name = "cgrd"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Guard: stateless person-and-profile checks, rule engine and handle checks that run everywhere"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cgrd"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[features]
default = ["storage"]
storage = ["dep:crlt"]

[dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "3ea958b522a15fecf65630aae1f9944135105497", default-features = false }
cshm = { git = "https://github.com/corbet-foss/cshm", rev = "01e259cad7e64cb2150344153ae350a23d05f478" }
cpns = { git = "https://github.com/corbet-foss/cpns", rev = "d68a3f3a2df322c513d0e754e452ee02aab7a5b9", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
precis-profiles = "=0.2.0"
unicode-security = "=0.1.2"
rustrict = { version = "=0.7.39", default-features = false, features = ["censor"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
bigdecimal = "0.4.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "80dc046d6ab53b3ea530c45bf3d7038c8b2c61b2", optional = true }

[dev-dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "3ea958b522a15fecf65630aae1f9944135105497", features = ["volatile-signer"] }
coset = "0.4.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
